<style>
/* One 16:9 stage. The street model fills it; kinetic type sits on the left; everything is driven by one GSAP timeline. White and hot pink only. */
:root { --bg:#ffffff; --fg:#15161a; --muted:#5b5f69; --line:#dcdde2; --hot:#ff1485; color-scheme: light;

* { box-sizing: border-box }
html, body { height: 100%; margin: 0 }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); overflow: hidden; display: grid; place-items: center }
#stage { position: relative; width: min(100vw, 177.78vh); aspect-ratio: 16 / 9; overflow: hidden; background: var(--bg); container-type: inline-size; cursor: pointer }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block }
#stage::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 64%; background: linear-gradient(to right, var(--bg) 0%, var(--bg) 42%, transparent 100%); opacity: .93; z-index: 1 }
.beat { position: absolute; z-index: 2; left: 5cqw; top: 50%; width: 52cqw; transform: translateY(-50%); visibility: hidden }
.ln { display: block; clip-path: inset(0 -100cqw 0 0); white-space: nowrap; font: 900 9.4cqw/.9 var(--display); text-transform: uppercase; letter-spacing: -.01em; padding: .05em .04em .02em 0 }
.ln.xl { font-size: 15cqw } .ln.md { font-size: 6.6cqw }
.ln .w { display: inline-block; white-space: pre; will-change: transform }
.hot { color: var(--hot) }
.mk { background: linear-gradient(var(--hot), var(--hot)) no-repeat 0 60% / 0% 86%; padding: 0 .08em; margin: 0 -.08em }
.sm { font: 500 1.75cqw/1.35 var(--sans); color: var(--fg); max-width: 27em; margin: 1.3cqw 0 0 }
.sm b { color: var(--hot); font-weight: 600 }
.tag { font: 400 .95cqw var(--mono); color: var(--muted); margin: 1.2cqw 0 0 }
.bars { display: grid; gap: .9cqw; margin-top: 1.6cqw; width: 40cqw }
.bars div { font: 500 1.15cqw var(--mono); color: var(--muted) }
.bars i { display: block; height: 1.3cqw; background: var(--fg); transform-origin: left center; transform: scaleX(0); margin-bottom: .35cqw }
.bars .b i { background: var(--hot) }
#prog { position: absolute; z-index: 3; left: 0; bottom: 0; height: .35cqw; width: 100%; background: var(--hot); transform-origin: left center; transform: scaleX(0) }
#wipe { position: absolute; z-index: 4; inset: 0; background: var(--hot); transform: translateX(-101%) }
</style>
<div id="stage"><canvas id="cv"></canvas><div id="k"></div><div id="wipe"></div><div id="prog"></div></div>
