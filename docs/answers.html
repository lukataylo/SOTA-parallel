<title>Flood Tests Answer Cards</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@600;800&family=Space+Grotesk:wght@400;500;600&family=Space+Mono&display=swap">
<style>
/* Layout: a dark instrument panel for a phone. Status strip, one answer card, a waveform, then the controls within thumb reach. One look, dark only. */
:root { --bg:#000000; --panel:#0d0d0d; --fg:#f5f5f5; --muted:#8a8a8a; --line:#262626; --hot:#d71921; --dot:#1c1c1c; color-scheme: dark;
  --matrix:'Doto', 'Space Mono', ui-monospace, monospace; --sans:'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; --mono:'Space Mono', ui-monospace, Menlo, monospace; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent }
html, body { height: 100% }
body { background: var(--bg); background-image: radial-gradient(var(--dot) 1px, transparent 1.2px); background-size: 14px 14px; color: var(--fg); font-family: var(--sans); display: flex; flex-direction: column; gap: 10px; padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
[hidden] { display: none !important }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; font: 800 15px var(--matrix); letter-spacing: .08em; text-transform: uppercase }
.top .led { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); margin-right: 8px; vertical-align: 1px }
.top.on .led { background: var(--hot); box-shadow: 0 0 10px var(--hot); animation: blink 1.1s steps(2) infinite }
#status { color: var(--muted); text-align: right; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.chip { min-height: 0; padding: 6px 12px; font-size: 12px; flex: none }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg) }
#status { flex: 1 }
.card { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; justify-content: center; gap: clamp(12px, 2.4vh, 26px); background: var(--panel); border: 1px solid var(--line); border-radius: 26px; padding: clamp(18px, 4vw, 44px); max-width: 1100px; width: 100%; margin: 0 auto }
.card.pop { animation: pop .45s cubic-bezier(.2, 1.4, .4, 1) }
.tag { font: 600 13px var(--matrix); letter-spacing: .1em; text-transform: uppercase; color: var(--hot); margin: 0 }
.q { font: 500 clamp(17px, 2.4vw, 28px)/1.3 var(--sans); color: var(--muted); text-wrap: balance; margin: 0 }
.a { display: flex; flex-direction: column; gap: clamp(10px, 1.8vh, 20px); margin: 0; padding: 0; list-style: none }
.a li { font: 600 clamp(26px, 6.4vw, 62px)/1.08 var(--sans); letter-spacing: -.02em; text-wrap: balance; overflow-wrap: anywhere; animation: rise .4s ease both }
.a li:nth-child(2) { animation-delay: .06s } .a li:nth-child(3) { animation-delay: .12s } .a li:nth-child(4) { animation-delay: .18s }
.a li.wait { color: var(--muted); font-family: var(--matrix); font-weight: 800 }
.wave { height: 56px; width: 100%; max-width: 1100px; margin: 0 auto; display: block }
.live { font: 400 15px/1.35 var(--mono); color: var(--hot); min-height: 1.35em; max-width: 1100px; width: 100%; margin: 0 auto; text-align: center }
.bar { display: flex; gap: 10px; align-items: center; justify-content: center; max-width: 1100px; width: 100%; margin: 0 auto }
button { font: 800 15px var(--matrix); letter-spacing: .08em; text-transform: uppercase; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 14px 18px; cursor: pointer; min-height: 48px }
button:disabled { opacity: .35; cursor: default }
button.mic { width: 76px; height: 76px; padding: 0; border-radius: 50%; background: var(--fg); color: var(--bg); border: 0; font-size: 13px; flex: none }
button.mic.on { background: var(--hot); color: #fff; box-shadow: 0 0 0 8px rgba(215, 25, 33, .18) }
button:focus-visible, input:focus-visible { outline: 2px solid var(--hot); outline-offset: 3px }
.nav { flex: 1; max-width: 170px }
.count { font: 800 15px var(--matrix); color: var(--muted); min-width: 6ch; text-align: center; font-variant-numeric: tabular-nums }
form { display: flex; gap: 8px; width: 100%; max-width: 1100px; margin: 0 auto }
input { flex: 1; min-width: 0; font: 400 16px var(--sans); color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 13px 18px }
input::placeholder { color: var(--muted) }
@keyframes pop { from { transform: scale(.94) translateY(14px); opacity: 0 } to { transform: none; opacity: 1 } }
@keyframes rise { from { transform: translateY(10px); opacity: 0 } to { transform: none; opacity: 1 } }
@keyframes blink { 50% { opacity: .35 } }
@media (prefers-reduced-motion: reduce) { .card.pop, .a li, .top.on .led { animation: none } }
</style>
<div class="top" id="top"><span><i class="led"></i>Flood tests</span><span id="status">Ready</span><button id="slides" class="chip" aria-pressed="false">Slides</button></div>
<main class="card" id="card" aria-live="polite">
  <p class="tag" id="tag"></p>
  <p class="q" id="q"></p>
  <ul class="a" id="a"></ul>
</main>
<canvas class="wave" id="wave" aria-hidden="true"></canvas>
<div class="live" id="live" aria-live="polite"></div>
<div class="bar">
  <button class="nav" id="prev" aria-label="Previous card">Back</button>
  <button class="mic" id="mic" hidden>Listen</button>
  <button class="nav" id="next" aria-label="Next card">Next</button>
</div>
<div class="bar"><span class="count" id="count"></span></div>
<form id="form"><input id="ask" autocomplete="off" placeholder="Or type a question" aria-label="Question"><button type="submit" id="send">Ask</button></form>
<script>
'use strict';
const $ = id => document.getElementById(id);
// Everything the answers may draw on. Kept in one place so the model cannot wander outside it.
const FACTS = `PROJECT: a weekend hackathon entry (SoTA Scientific Parallelism Hackathon, London, November 2026). The brief asks what we could learn if computing were faster or could run many possibilities at once. Its flood example is running thousands of rainfall scenarios.
WHAT WE DID: We took half a kilometre of London around Southwark Underground station and Blackfriars Road (512 by 512 metres, one-metre grid, Environment Agency laser height survey of 2022). We kept the storm fixed and changed the ground. Every 5 metre square of open ground (7,894 squares) was raised 5 cm and lowered 5 cm, and the storm re-run. That is 15,788 tests. A test counts if the highest water at a point on a building wall, more than 7.5 m away, moves by 1 cm or more. There are 207 wall points. A wall point counts as flooded at 10 cm.
THE SIMULATION: a standard 2D shallow-water flood model (the local-inertial form of Bates and colleagues, 2010), running on laptop graphics chips (an M4 MacBook Air and an M3 MacBook Pro). About 18,000 time steps of about 0.15 seconds. One run takes about 13 seconds. Buildings are solid walls. Water leaves freely at the edges. Water balance is checked after every run and agrees to about 1 part in 100,000.
THE STORM: rain builds for 20 minutes to about 125 mm an hour, then eases for 20 minutes; about 43 mm falls. Drains are assumed to take 12 mm an hour while it rains, leaving 35 mm on the ground. The run lasts one hour. We also ran storms leaving 15 mm and 70 mm for some checks. Rain on roofs is removed (assumed to go to the sewer). The ground soaks up nothing. One ground roughness everywhere (Manning 0.015, like tarmac).
THE PARALLEL IDEA: a 5 cm change mostly affects water nearby (half the effects reach less than 20 m). So squares 150 m apart are changed in the same run, about nine tests per run (8.8 on average), and each change in water is credited to the nearest changed square. This idea comes from Curtis, Powell and Reid (1974), who used it for sparse derivatives. We did not find it used for flood tests. A long pool can connect distant patches, so every apparent finding is re-run with different neighbours; that check is part of the method.
THE SPEEDUP: 15,788 tests in 1,956 runs (1,800 map runs, 126 confirmation runs, 30 tracing runs). About 7 hours of graphics-chip time (6.9) against about 55 hours one test per run. The 55 hours is an estimate from timed single runs (15,788 times about 13 seconds); we did not run it. That is 8 times less compute (8.1), on the same solver, laptops and storm. It is per storm. Running several simulations at once on the laptop chip gave no gain, because one simulation already fills it.
THE RESULT: 98 tests on 84 squares move a building wall's highest water by 1 cm or more. That is about 1 square in 100. Typical distance from square to wall is 20 m; 86% are more than 10 m away; the furthest about 100 m. Typical effect 1.7 cm, largest 7.8 cm. 60 make a wall wetter, 38 drier. 16 of the 98 take a wall point across the 10 cm flood line (8 each way). Some squares are on railway land.
THE FIX: we picked five squares from the map (raised two, lowered three) and ran them together. Water at five building walls fell by 1.8 to 6.5 cm. Nowhere rose by 1 cm or more (largest rise 0.24 cm). The combined result matched the sum of the five single tests to 0.2 mm. The fix was chosen for the 35 mm storm.
CHECKS THAT PASSED (pass marks were written down before each check was run): findings re-run alone, 68 of 73 gave the same answer (93%); repacked 300 m apart, 96 of 103; 120 squares the map ruled out were run alone and none moved a building, which puts the miss rate under about 2.5%, not zero; with the ground twice as rough, 81 of 98 findings held; with water leaving through 303 road drains placed by rule instead of a flat allowance, 79 of 98 held; packed twice as tight (75 m apart, 35 tests per run), the lowered half finished and all 34 of 34 known results showed up.
CHECKS THAT FAILED: crediting the nearest square was wrong 4.75% of the time (pass mark 2%), because long ponds carry effects past 75 m; the re-run step fixes it. At double the rain only 53 of 98 findings held (pass mark 66), so each storm needs its own map. A ten-minute shortcut model that fills dips with no flow physics found 77% of the squares (pass mark 80%); two improved versions tested on half the street they had not seen also found 77%; it ranks ground but cannot safely rule ground out, because it models where water rests, not how high it gets. Scaling up a tiny 5 mm change found only 55% of findings, which suggests a derivative method would miss many; we did not build an adjoint.
NO VERDICT: the raised half of the 75 m packing stopped at 167 of 225 runs when a laptop went to sleep (38 of 38 seen so far). A map at the 70 mm storm also did not finish.
TREES AND DRAINS (first look only, one run each): 20 street trees with soil pits placed where kerb water is deepest lowered the water at 8 building walls by 1 to 1.7 cm in the 35 mm storm; none rose; no wall dropped below 10 cm; placed at random the trees helped 1 wall; at 70 mm none.
LIMITS: one neighbourhood, one storm size for the full map. No real sewer data. No recorded rain flood on this street to check against, so the model has not been validated; it shows which ground the simulation reacts to and is not a forecast. The only large flood here was a burst 36-inch water main on 21 January 2020, which closed Southwark station; that was a pipe, not rain, and we did not simulate it; our 35 mm storm puts 17 cm of water on the same low stretch of road. The height survey is good to about 5 cm point to point on open ground (15 cm absolute by specification), the same size as the changes we test. A one-metre grid blurs kerbs. The animation in the presentation is a simplified 4 metre replay; every number comes from the 1 metre runs. No cloud computing was used for any number.
WHY IT MATTERS: the Environment Agency counts 4.6 million properties in England at risk from surface water, against 2.4 million from rivers and the sea. A Met Office study (Kendon and colleagues, 2023) expects 20 mm-an-hour downpours four times as often in the UK by 2080 as in the 1980s if emissions stay high. Insured losses from the London floods of 12 to 14 July 2021 were about 281 million pounds (PERILS). If a few squares decide a building's flooding, those are the squares worth surveying on foot or changing. We did no insurance analysis.
SCALE: London is about 6,000 neighbourhoods this size. One map costs about 7 laptop graphics-chip hours per storm in place of 55. Each neighbourhood can run on its own machine. We have not run a second neighbourhood, so we do not know if 150 m spacing works elsewhere.
PRIOR WORK: national Environment Agency flood maps show where water goes, not which ground is responsible. A published study (arXiv 2311.00420) tests changes one simulation at a time. Blue Spot, SCALGO and similar fill models give the rain needed to flood a point. De Almeida, Bates and Ozdemir (2018) showed street height changes of tens of centimetres change simulated floods. Our search was one weekend, so we say "we did not find", not "first".`;
const PREPARED = [
  ["What did you do, in one breath?", "We tested every 5 metre square of half a kilometre of London.\nWe raised and lowered each one by 5 cm and re-ran the storm.\nAbout 1 square in 100 changes the water at a building."],
  ["How do you know the model is right?", "We don't.\nNo rain flood is on record for this street.\nThis shows what the model reacts to. It is not a forecast."],
  ["Did you run the 55-hour baseline?", "No.\nIt is 15,788 runs times the 13 seconds we measured.\nThe 8 times is a count of runs: 15,788 against 1,956."],
  ["Where is the parallelism?", "In space.\nOne simulation carries about nine separate tests.\nThey sit 150 metres apart, so they don't disturb each other."],
  ["0 of 120 is a small sample. What did you miss?", "It shows the miss rate is under about 2.5%.\nIt is not zero.\n98 is what we found, not a proven total."],
  ["Why not use an adjoint?", "We didn't build one.\nA tiny 5 mm change, scaled up, found only 55%.\nThat suggests slopes miss water spilling over a lip."],
  ["Only 53 of 98 held at double the rain.", "Yes. That failed our pass mark.\nIt means each storm needs its own map.\nThat is why a map should cost 7 hours, not 55."],
  ["Does any change take a building across the flood line?", "Yes.\n16 of the 98 cross the 10 cm line.\n8 go each way."],
  ["Real floods come from sewers. You have none.", "Correct. It is our biggest gap.\nWith 303 drains placed by rule, 79 of 98 findings held.\nThat is not the same as sewers backing up."],
  ["Will 150 metres work on another street?", "We don't know.\nHere about 5% of effects travelled past 75 metres.\nSo the re-run check must be repeated on every site."]
];
const SLIDES = [
  ["Where could five centimetres make a difference?", "The brief asks what we learn by computing many possibilities at once.\nThe usual answer is many storms.\nWe kept the storm and changed the street: 15,788 tests."],
  ["More homes are at risk from rain than from rivers", "4.6 million properties in England are at risk from heavy rain.\nFlood maps show where the water ends up.\nThey don't show which ground sent it there."],
  ["Heavy rain is getting more common", "Warm air holds more water: 7% more per degree.\nThe Met Office expects flash-flood downpours four times as often by 2080.\nOn screen: our street under twice the storm we mapped."],
  ["One storm takes 13 seconds to simulate", "A standard flood model on a one-metre grid of real ground.\nOne storm takes about 13 seconds on a laptop.\nSimple on purpose: solid walls, flat drainage, one roughness.\nEvery run's water adds up to 1 part in 100,000."],
  ["Lower this kerb and watch the wall", "We lower 5 by 5 metres of ground by 5 cm.\nWatch the peak depth at the wall 9 metres away.\nIt falls from 6.1 to 2.5 cm.\nA change of 1 cm or more counts."],
  ["That is 15,788 runs", "7,894 squares, each raised and each lowered.\nOne at a time is about 55 GPU-hours.\nThat is an estimate. We did not run it."],
  ["Squares 150 m apart can share a run", "One storm can test eleven distant changes.\nIf water connects two patches, we rerun to find the cause.\nGrouping tests is an old idea. Using it for street changes is ours."],
  ["From 15,788 runs to 1,956", "1,800 grouped runs plus 156 checks.\nEight times as many tests per run.\n55 hours estimated. 6.9 measured."],
  ["One failure, and how we solved it", "18 of 379 changes had no changed square nearby.\nLong pools carry an effect 76 to 124 metres.\nAll 25 cases were reproduced by one square alone."],
  ["About one square in a hundred matters", "84 of 7,894 squares matter.\nEach arrow runs from a square to the wall it affects.\nTypically 20 metres away."],
  ["We tried a fix in the simulation", "Five squares from the map, run together.\nFive walls fell by 1.8 to 6.5 cm.\nNowhere rose by 1 cm or more."],
  ["Three things that didn't work", "Several simulations at once: no faster.\nThe ten-minute shortcut found 77%. Our mark was 80%.\nAt double the rain only 53 of 98 held."],
  ["What we claim", "Five changes from the map did what the map said.\nThe largest rise anywhere was 0.24 cm.\nDouble the rain and only 53 of 98 hold.\nA different storm needs a different map."],
  ["Backup: the 2020 burst water main", "A 36-inch main burst here in January 2020.\nIt was a pipe, not rain.\nOur storm pools water at the same low point: 17 cm."],
  ["Backup: trees and drains", "A first look only. One run each.\n20 trees lowered water at 8 walls by 1 to 1.7 cm.\nWith 303 road drains, 79 of 98 findings held."],
  ["Backup: what we read", "Flood maps show where water goes, not which ground is to blame.\nA published study tests one change per run.\nWe borrowed the grouping idea from 1974."],
  ["Backup: the other checks", "Re-run alone: 68 of 73 gave the same answer.\nNone of 120 dismissed changes crossed 1 cm.\nRougher ground: 81 of 98 held."]
];
let showSlides = false; try { showSlides = localStorage.getItem('flood-show-slides') === '1'; } catch (e) {}
const SLIDECARDS = SLIDES.map(([q, a], n) => ({ q, a, prepared: true, slide: n + 1 })), QA = PREPARED.map(([q, a]) => ({ q, a, prepared: true })); let live = [], cards = [], at = 0;
function build() { cards = (showSlides ? SLIDECARDS : []).concat(QA, live); }
try { const s = JSON.parse(localStorage.getItem('flood-answer-cards') || '[]'); if (Array.isArray(s)) live = s.filter(c => c && c.q && c.a); } catch (e) {}
build();
function save() { try { localStorage.setItem('flood-answer-cards', JSON.stringify(live.filter(c => c.a && !c.pending && !c.error).slice(-40))); } catch (e) {} }
function lines(t) { return t.replace(/\r/g, '').split(/\n+|(?<=[.?!])\s+(?=[A-Z0-9"“])/).map(x => x.trim()).filter(Boolean); }
function show() {
  const c = cards[at]; $('q').textContent = c.q; $('tag').textContent = c.slide ? 'Slide ' + c.slide + ' of ' + SLIDES.length + ' · what to say' : c.prepared ? 'Prepared answer' : c.pending ? 'Answering…' : c.error ? 'Could not answer' : 'Answered from the project facts';
  const ul = $('a'); ul.replaceChildren(); const ls = c.a ? lines(c.a) : [c.pending ? 'Thinking…' : '']; ls.forEach(t => { const li = document.createElement('li'); li.textContent = t; if (!c.a) li.className = 'wait'; ul.append(li); });
  $('count').textContent = (at + 1) + ' / ' + cards.length; $('prev').disabled = at === 0; $('next').disabled = at === cards.length - 1;
}
function go(n) { const was = at; at = Math.max(0, Math.min(cards.length - 1, n)); show(); if (at !== was) { const c = $('card'); c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop'); } }
$('prev').onclick = () => go(at - 1); $('next').onclick = () => go(at + 1);
window.addEventListener('keydown', e => { if (e.target === $('ask')) return; if (e.key === 'ArrowLeft') go(at - 1); if (e.key === 'ArrowRight') go(at + 1); });
let sample = null, dict = null, perms = null, busy = false, alwaysOn = true; const queue = [];
async function ask(q) {
  q = q.trim(); if (q.split(/\s+/).length < 2) return; if (busy) { queue.push(q); return; }
  const c = { q, a: '', pending: true }; live.push(c); build(); go(cards.length - 1);
  if (!sample) { c.pending = false; c.error = true; c.a = 'This page cannot reach Claude here. Open it in claude.ai while signed in. The prepared cards still work.'; show(); return; }
  busy = true; $('status').textContent = 'Answering…';
  const prompt = 'You are helping a presenter answer a judge\'s question about their hackathon project, live, on a big screen.\n\nRules:\n- Use only the facts below. Never invent a number, a result or a source.\n- Answer in 2 to 4 short sentences. Put each sentence on its own line. No bullets, no bold, no headings.\n- Plain words a non-specialist understands. Say "we". Lead with the direct answer (Yes, No, We don\'t know).\n- If the facts do not cover the question, say "We did not test that." and then give the nearest fact that helps.\n- Be honest about limits and failed checks. Do not oversell.\n- The question came from speech recognition and may contain mishearings; answer the most likely intended question.\n\n<facts>\n' + FACTS + '\n</facts>\n\n<question>\n' + q + '\n</question>';
  try {
    const r = await sample(prompt, { modelTier: 'quick', cache: false, onText: u => { c.a = u.text; if (cards[at] === c) show(); } });
    c.a = (r.text || c.a || '').trim() || 'No answer came back. Try asking again.'; c.pending = false; save();
  } catch (e) {
    c.pending = false; c.error = true; const code = e && e.code;
    c.a = code === 'not_granted' ? 'Asking Claude is switched off for this page. The prepared cards still work.' : code === 'rate_limited' ? 'Too many questions at once. Wait a moment and ask again.' : (e && e.text) ? e.text : 'The answer did not come through. Ask again.';
  }
  busy = false; $('status').textContent = dict && dict.active() ? 'Listening' : 'Ready'; if (cards[at] === c) show(); if (queue.length) ask(queue.shift());
}
$('form').addEventListener('submit', e => { e.preventDefault(); const v = $('ask').value; $('ask').value = ''; ask(v); });
// ---- listening: each pause of about two seconds sends what was heard as one question ----
let heard = '', timer = null, listening = false, kick = 0;
// ---- waveform: a row of dots that lifts while listening and jumps when words arrive. It shows activity, not measured sound level. ----
(function wave() {
  const cv = $('wave'), cx = cv.getContext('2d'), still = window.matchMedia('(prefers-reduced-motion: reduce)').matches; let t = 0;
  function frame() {
    const w = cv.clientWidth, h = cv.clientHeight, d = Math.min(window.devicePixelRatio || 1, 2); if (cv.width !== Math.round(w * d)) { cv.width = Math.round(w * d); cv.height = Math.round(h * d); }
    cx.setTransform(d, 0, 0, d, 0, 0); cx.clearRect(0, 0, w, h); const n = Math.max(24, Math.floor(w / 9)), gap = w / n; t += still ? 0 : .06; kick *= .94;
    for (let i = 0; i < n; i++) {
      const u = i / (n - 1), env = Math.sin(Math.PI * u), amp = (listening ? .22 + .78 * kick : busy ? .3 : .04) * env;
      const v = amp * (.55 + .45 * Math.sin(t * 2.1 + i * .55) * Math.sin(t * .9 + i * .21)), bars = Math.max(1, Math.round(Math.abs(v) * h / 9));
      for (let k = 0; k < bars; k++) { const y = h / 2 + (k - (bars - 1) / 2) * 7; cx.fillStyle = listening ? (k === 0 || k === bars - 1 ? '#d71921' : '#f5f5f5') : busy ? '#f5f5f5' : '#3a3a3a'; cx.beginPath(); cx.arc(i * gap + gap / 2, y, 2, 0, 7); cx.fill(); }
    }
    requestAnimationFrame(frame);
  }
  frame();
})();
function flush() { timer = null; const t = heard.trim(); heard = ''; $('live').textContent = ''; if (t) ask(t); }
function wire() {
  dict.onPartial(({ text }) => { kick = 1; $('live').textContent = (heard + ' ' + text).trim(); if (timer) { clearTimeout(timer); timer = null; } });
  dict.onFinal(({ text }) => { kick = 1; heard = (heard + ' ' + text).trim(); $('live').textContent = heard; if (timer) clearTimeout(timer); timer = setTimeout(flush, 2200); });
  dict.onState(({ state, reason }) => {
    const on = state === 'listening' || state === 'starting'; $('mic').classList.toggle('on', on); $('top').classList.toggle('on', on); $('mic').textContent = on ? 'Stop' : 'Listen'; listening = on;
    $('status').textContent = on ? 'Listening' : reason === 'not_granted' ? 'Microphone not allowed. Type the question instead.' : reason === 'time_limit' ? 'Listening timed out. Press Listen again.' : 'Ready';
    if (!on && heard.trim() && !timer) flush();
    if (state === 'idle' && alwaysOn && reason !== 'viewer_stopped' && reason !== 'not_granted' && reason !== 'stopped') setTimeout(startListening, 400);
  });
}
function startListening() {
  if (!dict || dict.active() || !alwaysOn) return;
  dict.start({ language: 'en-GB' }).catch(e => { const code = e && e.code; if (code === 'not_granted') { alwaysOn = false; $('status').textContent = 'Microphone not allowed. Type instead.'; } else { $('status').textContent = 'Tap anywhere to keep listening'; armTap(); } });
  if (perms) perms.request(['sample']).catch(() => {});
}
function armTap() { document.addEventListener('pointerdown', function once(e) { document.removeEventListener('pointerdown', once, true); if (e.target && e.target.id === 'mic') return; startListening(); }, true); }
$('mic').onclick = () => { if (!dict) return; if (dict.active()) { alwaysOn = false; dict.stop().catch(() => {}); } else { alwaysOn = true; startListening(); } };
$('slides').onclick = () => { showSlides = !showSlides; try { localStorage.setItem('flood-show-slides', showSlides ? '1' : '0'); } catch (e) {} $('slides').setAttribute('aria-pressed', String(showSlides)); const cur = cards[at]; build(); at = Math.max(0, cards.indexOf(cur)); if (showSlides && cur && !cur.slide) at = 0; show(); };
$('slides').setAttribute('aria-pressed', String(showSlides));
show();
(async () => {
  const use = window.claude && window.claude.use; if (!use) { $('status').textContent = 'Prepared cards only'; return; }
  [sample, dict, perms] = await Promise.all([window.claude.use('sample'), window.claude.use('dictation'), window.claude.use('permissions')]);
  if (dict) { wire(); $('mic').hidden = false; $('status').textContent = 'Tap anywhere to start listening'; armTap(); }
  if (!sample) $('status').textContent = 'Prepared cards only';
})();
</script>
